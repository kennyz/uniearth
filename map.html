    <div class="seg" id="projbtns"></div>

    <div class="zoombar">
      <button data-zoom="in" title="Zoom in">＋</button>
      <button data-zoom="out" title="Zoom out">－</button>
      <button data-zoom="reset" class="wide" title="Reset view">Reset</button>
      <button data-zoom="full" id="fsbtn" class="fs" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
    </div>
  </header>

      <svg id="map" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1000 520"></svg>

      <div id="legend"></div>
